databases:
  - name: bigbwarehouse
    databaseName: bigbwarehouse
    user: bigb_admin

services:
  - type: web
    name: bigb-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bigbwarehouse
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "bigb-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://bigbwarehouse.vercel.app"
